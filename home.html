<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home • FreeTime</title>

    <link rel="stylesheet" href="home.css">
</head>
<script type="module" src="home.js"></script>
<body>

    <!-- TOP NAVBAR -->
    <header class="topbar">

        <div class="logo-area">
            <div class="mini-logo">F</div>
            <span>FreeTime</span>
        </div>

        <div class="top-actions">
            <button>⌕</button>
            <button>💬</button>
            <button>🔔</button>
        </div>

    </header>


    <!-- MAIN -->
    <main class="main-container">

        <!-- CREATE POST -->
        <section class="create-post">

            <div class="post-top">

                <div class="profile-circle">
                    U
                </div>

                <button class="post-input">
                    What's on your mind?
                </button>

            </div>

            <div class="post-options">

                <button>
                    📷 Photo
                </button>

                <button>
                    🎥 Video
                </button>

                <button>
                    😊 Feeling
                </button>

            </div>

        </section>


        <!-- STORIES -->
        <section class="stories">

            <div class="story create-story">

                <div class="story-add">+</div>

                <span>Your Story</span>

            </div>

            <div class="story">
                <div class="story-user">A</div>
                <span>Story</span>
            </div>

            <div class="story">
                <div class="story-user">M</div>
                <span>Story</span>
            </div>

            <div class="story">
                <div class="story-user">R</div>
                <span>Story</span>
            </div>

            <div class="story">
                <div class="story-user">S</div>
                <span>Story</span>
            </div>

        </section>


        <!-- FEED -->

        <section class="feed">

            <!-- POST -->
            <article class="post">

                <div class="post-header">

                    <div class="profile-circle">
                        F
                    </div>

                    <div>
                        <strong>FreeTime</strong>
                        <small>Just now · 🌎</small>
                    </div>

                    <button class="more">⋯</button>

                </div>

                <div class="post-content">

                    <p>
                        Welcome to <strong>FreeTime</strong> 🎉
                    </p>

                    <p>
                        Enjoy Your Free Time with us.
                    </p>

                </div>

                <div class="post-stats">

                    <span>❤️ 0</span>
                    <span>0 Comments</span>

                </div>

                <div class="post-actions">

                    <button>♡ Like</button>
                    <button>💬 Comment</button>
                    <button>↗ Share</button>

                </div>

            </article>


            <!-- SAMPLE POST -->
            <article class="post">

                <div class="post-header">

                    <div class="profile-circle">
                        U
                    </div>

                    <div>
                        <strong>FreeTime User</strong>
                        <small>5 min · 🌎</small>
                    </div>

                    <button class="more">⋯</button>

                </div>

                <div class="post-content">

                    <p>
                        Hello FreeTime! 👋
                    </p>

                </div>

                <div class="post-stats">

                    <span>❤️ 0</span>
                    <span>0 Comments</span>

                </div>

                <div class="post-actions">

                    <button>♡ Like</button>
                    <button>💬 Comment</button>
                    <button>↗ Share</button>

                </div>

            </article>

        </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <a class="active" href="home.html">
            🏠
            <span>Home</span>
        </a>

        <a href="#">
            🔍
            <span>Search</span>
        </a>

        <a href="#">
            ➕
            <span>Create</span>
        </a>

        <a href="#">
            🔔
            <span>Alerts</span>
        </a>

        <a href="#">
            👤
            <span>Profile</span>
        </a>

    </nav>

</body>
                                               </html>
