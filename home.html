<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home • FreeTime</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #f5f7fb;

            color: #111827;

            padding-bottom: 70px;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;
            height: 60px;

            background: #ffffff;

            display: flex;
            align-items: center;

            padding: 0 18px;

            border-bottom: 1px solid #e5e7eb;
        }


        .header-inner {
            width: 100%;
            max-width: 1100px;

            margin: auto;

            display: flex;
            align-items: center;
        }


        .logo {
            color: #1877f2;

            font-size: 25px;

            font-weight: 800;

            text-decoration: none;
        }


        /* =========================
           SEARCH
        ========================== */

        .search {
            flex: 1;

            max-width: 360px;

            margin-left: 25px;
        }


        .search input {
            width: 100%;

            padding: 10px 16px;

            border: none;

            outline: none;

            border-radius: 22px;

            background: #f0f2f5;

            font-size: 14px;
        }


        /* =========================
           HEADER ACTIONS
        ========================== */

        .header-actions {
            margin-left: auto;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .header-btn {
            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background: #f0f2f5;

            font-size: 18px;

            cursor: pointer;
        }


        .header-btn:hover {
            background: #e4e6eb;
        }


        .mini-avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #1877f2;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }


        /* =========================
           MAIN
        ========================== */

        .main {
            width: 100%;

            max-width: 680px;

            margin: auto;

            padding: 18px 12px;
        }


        /* =========================
           USER WELCOME
        ========================== */

        .welcome {
            background: #ffffff;

            border-radius: 14px;

            padding: 15px;

            margin-bottom: 14px;

            border: 1px solid #e5e7eb;
        }


        .welcome-row {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .welcome-avatar {
            width: 44px;
            height: 44px;

            border-radius: 50%;

            background: #1877f2;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            font-weight: bold;
        }


        .welcome-text {
            min-width: 0;
        }


        .welcome-text strong {
            display: block;

            font-size: 15px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .welcome-text span {
            display: block;

            margin-top: 3px;

            font-size: 12px;

            color: #6b7280;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================
           STORIES
        ========================== */

        .stories {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 14px;
        }


        .section-title {
            font-size: 16px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        .story-list {
            display: flex;

            gap: 10px;

            overflow-x: auto;

            scrollbar-width: none;
        }


        .story-list::-webkit-scrollbar {
            display: none;
        }


        .story {
            flex: 0 0 82px;

            height: 112px;

            border-radius: 12px;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    #1877f2,
                    #7b2ff7
                );

            color: #ffffff;

            display: flex;

            align-items: flex-end;

            padding: 8px;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }


        .create-story {
            background: #f0f2f5;

            color: #111827;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        /* =========================
           CREATE POST
        ========================== */

        .create-post {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 14px;
        }


        .create-row {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .create-avatar {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #1877f2;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }


        .create-input {
            flex: 1;

            border: none;

            outline: none;

            background: #f0f2f5;

            border-radius: 22px;

            padding: 11px 15px;

            font-size: 14px;
        }


        .create-actions {
            display: flex;

            gap: 5px;

            margin-top: 12px;

            padding-top: 10px;

            border-top: 1px solid #eeeeee;
        }


        .create-action {
            flex: 1;

            border: none;

            background: transparent;

            padding: 9px 5px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;
        }


        .create-action:hover {
            background: #f0f2f5;
        }


        /* =========================
           POST
        ========================== */

        .post {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            margin-bottom: 14px;

            overflow: hidden;
        }


        .post-header {
            display: flex;

            align-items: center;

            gap: 10px;

            padding: 14px;
        }


        .post-avatar {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #1877f2,
                    #7b2ff7
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }


        .post-user {
            font-size: 14px;

            font-weight: 700;
        }


        .post-time {
            margin-top: 3px;

            font-size: 11px;

            color: #6b7280;
        }


        .post-content {
            padding: 0 14px 14px;

            line-height: 1.5;

            font-size: 15px;
        }


        .post-media {
            width: 100%;

            min-height: 180px;

            background: #eef2ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;
        }


        /* =========================
           POST STATS
        ========================== */

        .post-stats {
            display: flex;

            justify-content: space-between;

            padding: 10px 14px;

            color: #6b7280;

            font-size: 12px;

            border-bottom: 1px solid #eeeeee;
        }


        /* =========================
           POST BUTTONS
        ========================== */

        .post-buttons {
            display: flex;

            padding: 4px;
        }


        .post-buttons button {
            flex: 1;

            border: none;

            background: transparent;

            color: #4b5563;

            padding: 10px 5px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;
        }


        .post-buttons button:hover {
            background: #f0f2f5;
        }


        /* =========================
           LOGOUT
        ========================== */

        .logout-area {
            text-align: center;

            margin: 25px 0;
        }


        .logout-btn {
            border: none;

            background: #fee2e2;

            color: #dc2626;

            padding: 10px 25px;

            border-radius: 9px;

            font-weight: 700;

            cursor: pointer;
        }


        .logout-btn:hover {
            background: #fecaca;
        }


        /* =========================
           MOBILE NAV
        ========================== */

        .mobile-nav {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;

            height: 58px;

            background: #ffffff;

            border-top: 1px solid #e5e7eb;

            display: none;

            z-index: 2000;
        }


        .mobile-nav a {
            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: #4b5563;

            font-size: 20px;
        }


        .mobile-nav a.active {
            color: #1877f2;
        }


        /* =========================
           TABLET
        ========================== */

        @media (max-width: 700px) {

            .search {
                display: none;
            }

            .main {
                max-width: 100%;

                padding: 12px 8px;
            }

            .header-inner {
                padding: 0;
            }

            .header-btn {
                width: 37px;
                height: 37px;

                font-size: 17px;
            }

            .mobile-nav {
                display: flex;
            }

            body {
                padding-bottom: 65px;
            }
        }


        /* =========================
           SMALL MOBILE
        ========================== */

        @media (max-width: 380px) {

            header {
                padding: 0 10px;
            }

            .logo {
                font-size: 22px;
            }

            .header-actions {
                gap: 4px;
            }

            .header-btn {
                width: 34px;
                height: 34px;

                font-size: 15px;
            }

            .mini-avatar {
                width: 34px;
                height: 34px;
            }

            .story {
                flex-basis: 76px;

                height: 105px;
            }

            .post-buttons button {
                font-size: 12px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">

        <a
            href="home.html"
            class="logo"
        >
            FreeTime
        </a>


        <div class="search">

            <input
                type="search"
                placeholder="Search FreeTime..."
            >

        </div>


        <div class="header-actions">

            <button
                class="header-btn"
                title="Messages"
            >
                💬
            </button>


            <button
                class="header-btn"
                title="Notifications"
            >
                🔔
            </button>


            <div
                class="mini-avatar"
                id="headerAvatar"
            >
                U
            </div>

        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <!-- WELCOME -->

    <section class="welcome">

        <div class="welcome-row">

            <div
                class="welcome-avatar"
                id="welcomeAvatar"
            >
                U
            </div>


            <div class="welcome-text">

                <strong id="userName">
                    Loading...
                </strong>

                <span id="userEmail">
                </span>

            </div>

        </div>

    </section>



    <!-- STORIES -->

    <section class="stories">

        <div class="section-title">
            Stories
        </div>


        <div class="story-list">

            <div class="story create-story">
                ➕<br>
                Create Story
            </div>


            <div class="story">
                Your Story
            </div>


            <div class="story">
                FreeTime
            </div>


            <div class="story">
                Friends
            </div>

        </div>

    </section>



    <!-- CREATE POST -->

    <section class="create-post">

        <div class="create-row">

            <div
                class="create-avatar"
                id="createAvatar"
            >
                U
            </div>


            <input
                class="create-input"
                type="text"
                placeholder="What's on your mind?"
            >

        </div>


        <div class="create-actions">

            <button class="create-action">
                📷 Photo
            </button>


            <button class="create-action">
                🎥 Video
            </button>


            <button class="create-action">
                😊 Feeling
            </button>

        </div>

    </section>



    <!-- =========================
         POST
    ========================== -->

    <article class="post">


        <div class="post-header">

            <div class="post-avatar">
                F
            </div>


            <div>

                <div class="post-user">
                    FreeTime
                </div>

                <div class="post-time">
                    Just now · 🌎
                </div>

            </div>

        </div>


        <div class="post-content">

            Welcome to FreeTime! 🎉

            <br>

            Enjoy your free time with us.

        </div>


        <div class="post-media">
            🌟
        </div>


        <!-- REAL DATA WILL COME HERE -->

        <div class="post-stats">

            <span>
                0 Likes
            </span>

            <span>
                0 Comments · 0 Shares
            </span>

        </div>


        <div class="post-buttons">

            <button>
                ❤️ Like
            </button>


            <button>
                💬 Comment
            </button>


            <button>
                ↗️ Share
            </button>

        </div>

    </article>



    <!-- LOGOUT -->

    <div class="logout-area">

        <button
            class="logout-btn"
            onclick="logoutUser()"
        >
            🚪 Logout
        </button>

    </div>


</main>



<!-- =========================
     MOBILE NAVIGATION
========================= -->

<nav class="mobile-nav">

    <a
        href="home.html"
        class="active"
        title="Home"
    >
        🏠
    </a>


    <a
        href="#"
        title="Friends"
    >
        👥

    <a
        href="#"
        title="Create"
    >
        ➕
    </a>


    <a
        href="#"
        title="Messages"
    >
        💬
    </a>


    <a
        href="#"
        title="Profile"
    >
        👤
    </a>

</nav>



<!-- =========================
     FIREBASE
========================= -->

<script
    type="module"
    src="./home.js"
></script>


</body>

</html>
