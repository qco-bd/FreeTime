<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home • FreeTime</title>

    <link rel="stylesheet" href="./home.css">
    <script type="module" src="post-connect.js"></script>
</head>
<script type="module" src="post.js"></script>
    <script type="module" src="feed.js"></script>
    <script type="module" src="post-system.js"></script>
<script type="module" src="post-feed.js"></script>
    <script
    type="module"
    src="verification.js"
></script>
<body>

    <!-- HEADER -->
    <header class="top-header">

        <div class="logo">
            FreeTime
        </div>

        <div class="header-actions">

            <button>🔍</button>
            <button>💬</button>
            <button>🔔</button>

            <img
                id="headerAvatar"
                class="header-avatar"
                src=""
                alt="Profile"
            >

        </div>

    </header>


    <!-- MAIN -->
    <main class="main-container">

        <!-- WELCOME -->
        <section class="welcome-card">

            <img
                id="welcomeAvatar"
                class="welcome-avatar"
                src=""
                alt="Profile"
            >

            <div>

                <h2>
                    Welcome, <span id="userName">User</span> 👋
                </h2>

                <p id="userEmail"></p>

            </div>

        </section>


        <!-- STORIES -->
        <section class="stories">

            <div class="story">
                <div class="story-circle">+</div>
                <span>Create Story</span>
            </div>

            <div class="story">
                <div class="story-circle">👤</div>
                <span>Friend</span>
            </div>

            <div class="story">
                <div class="story-circle">🌎</div>
                <span>Explore</span>
            </div>

        </section>


        <!-- CREATE POST -->
        <div class="verification-box">

    <h3>Get Verified</h3>

    <p>
        Enter your FreeTime verification code.
    </p>

    <input
        type="text"
        id="verificationCode"
        placeholder="Verification code"
    >

    <button
        id="verifyAccountBtn"
        type="button"
    >
        Verify
    </button>

</div>

<div id="postsContainer"></div>
        <div id="postsContainer"></div>
        <section class="create-post">

            <div class="create-post-top">

                <img
                    id="createAvatar"
                    class="create-avatar"
                    src=""
                    alt="Profile"
                >

                <textarea
                    id="postText"
                    placeholder="What's on your mind?"
                ></textarea>

            </div>


            <!-- BACKGROUND SELECTOR -->

            <div
                id="backgroundSelector"
                class="background-selector"
            >

                <button
                    class="bg-option bg-1 active"
                    data-background="bg-1"
                    title="Blue"
                ></button>

                <button
                    class="bg-option bg-2"
                    data-background="bg-2"
                    title="Purple"
                ></button>

                <button
                    class="bg-option bg-3"
                    data-background="bg-3"
                    title="Sunset"
                ></button>

                <button
                    class="bg-option bg-4"
                    data-background="bg-4"
                    title="Green"
                ></button>

                <button
                    class="bg-option bg-5"
                    data-background="bg-5"
                    title="Pink"
                ></button>

                <button
                    class="bg-option bg-6"
                    data-background="bg-6"
                    title="Ocean"
                ></button>

                <button
                    class="bg-option bg-7"
                    data-background="bg-7"
                    title="Dark"
                ></button>

            </div>


            <div class="post-options">

                <button type="button">
                    📷 Photo
                </button>

                <button type="button">
                    🎥 Video
                </button>

                <button type="button">
                    😊 Feeling
                </button>

            </div>


            <button
                id="publishPostBtn"
                class="publish-btn"
            >
                Post
            </button>

            <p id="postStatus"></p>

        </section>


        <!-- POSTS -->
        <section id="postsContainer"></section>


        <!-- LOGOUT -->
        <button
            class="logout-btn"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </main>


    <!-- MOBILE NAV -->

    <nav class="mobile-nav">

        <button>🏠</button>
        <button>👥</button>
        <button>➕</button>
        <button>🔔</button>
        <button>☰</button>

    </nav>


    <script
        type="module"
        src="./home.js"
    ></script>

</body>

                    </html>
