<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login • FreeTime</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8faff);
        }

        .container {
            width: 92%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            margin: 0;
            font-size: 38px;
            color: #1877f2;
        }

        .logo p {
            color: #666;
            margin-top: 7px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .card h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1877f2;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1877f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d65d9;
        }

        .switch {
            text-align: center;
            margin-top: 18px;
            color: #666;
        }

        .switch span {
            color: #1877f2;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>FreeTime</h1>
        <p>Enjoy Your Free Time with us.</p>
    </div>

    <div class="card">

        <!-- LOGIN -->
        <div id="loginBox">

            <h2>Welcome Back</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button onclick="loginUser()">
                Log In
            </button>

            <div class="switch">
                Don't have an account?
                <span onclick="showSignup()">Create one</span>
            </div>

        </div>


        <!-- SIGNUP -->
        <div id="signupBox" class="hidden">

            <h2>Create Account</h2>

            <input
                type="text"
                id="signupName"
                placeholder="Full name"
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email address"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
            >

            <button onclick="signupUser()">
                Create Account
            </button>

            <div class="switch">
                Already have an account?
                <span onclick="showLogin()">Log in</span>
            </div>

        </div>

        <div id="message"></div>

    </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>
